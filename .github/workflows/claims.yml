name: claims

# Fails when a number or statement in README.md stops matching the code.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  claims:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: README claims match the code
        run: python3 tools/check_claims.py
